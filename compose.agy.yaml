# Portal and bridge share one container. Official CLI is external, never in image.
services:
  cliproxy-portal:
    environment:
      PORTAL_AGY_EMBEDDED: "true"
      PORTAL_AGY_BASE_URL: "http://127.0.0.1:18320"
      PORTAL_AGY_SECRET_FILE: "/run/secrets/portal_agy_secret"
      AGY_COMMAND: "/opt/cliproxy-agy/bin/agy"
      AGY_HOME: "/var/lib/cliproxy-agy"
      AGY_MAX_SESSIONS: "${AGY_MAX_SESSIONS:-3}"
      AGY_CATALOG_REFRESH_EXPERIMENTAL: "${AGY_CATALOG_REFRESH_EXPERIMENTAL:-false}"
    init: true
    mem_limit: "${PORTAL_CONTAINER_MEMORY:-1024000000}"
    volumes:
      - ./secrets/portal_agy_secret:/run/secrets/portal_agy_secret:ro
      - /opt/cliproxy-agy/bin/agy:/opt/cliproxy-agy/bin/agy:ro
      - /var/lib/cliproxy-agy:/var/lib/cliproxy-agy
