{{define "content"}}
<section class="auth-card auth-card-wide">
  <div class="auth-head"><span class="eyebrow">新用户</span><h1>申请注册</h1><p>填写真实信息，提交后由管理员人工核验。</p></div>
  {{if .Error}}<div class="alert danger" role="alert">{{.Error}}</div>{{end}}
  {{if .Flash}}<div class="alert {{.Flash.Kind}}" role="status">{{.Flash.Message}}</div>{{end}}
  <form method="post" action="/register" class="stack-form">
    {{if .CSRFToken}}<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">{{end}}
    <label>手机号<input type="tel" name="phone" inputmode="numeric" autocomplete="tel" value="{{.Phone}}" placeholder="请输入 11 位手机号" maxlength="11" required><span class="field-help">仅支持中国大陆手机号，+86、空格和短横线会自动标准化。</span></label>
    <label>姓名<input type="text" name="name" autocomplete="name" value="{{.Name}}" maxlength="80" required></label>
    <label>密码<input type="password" name="password" autocomplete="new-password" minlength="10" required><span class="field-help">至少 10 个字符，请勿使用手机号或常见弱密码。</span></label>
    <label>确认密码<input type="password" name="confirm_password" autocomplete="new-password" minlength="10" required></label>
    {{if .Rules}}
    <fieldset class="rules-box"><legend>使用规则</legend>
      {{range .Rules}}
      <label class="check-row rule-row"><input type="checkbox" name="rule" value="{{.ID}}"{{if .Checked}} checked{{end}}{{if $.RulesRequired}} required{{end}}> <span><strong>{{.Title}}</strong><br><span class="muted">{{.Body}}</span></span></label>
      {{end}}
      <input type="hidden" name="rules_version" value="{{.RulesVersion}}">
    </fieldset>
    {{end}}
    <button class="button primary wide" type="submit">提交注册申请</button>
  </form>
  <div class="auth-foot"><span>已有账号？</span><a href="/login">返回登录</a></div>
</section>
{{end}}
