{{define "content"}}
<div class="page-head"><div><span class="eyebrow">账户安全</span><h1>修改密码</h1><p class="muted">修改成功后，其他设备上的登录会话将全部失效。</p></div></div>
{{if .Error}}<div class="alert danger" role="alert">{{.Error}}</div>{{end}}{{if .Flash}}<div class="alert {{.Flash.Kind}}" role="status">{{.Flash.Message}}</div>{{end}}
<section class="card form-card narrow"><form method="post" action="/password" class="stack-form">{{if .CSRFToken}}<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">{{end}}<label>当前密码<input type="password" name="current_password" autocomplete="current-password" required></label><label>新密码<input type="password" name="new_password" autocomplete="new-password" minlength="{{.MinimumLength}}" required><span class="field-help">至少 {{.MinimumLength}} 个字符。</span></label><label>确认新密码<input type="password" name="confirm_password" autocomplete="new-password" required></label><div class="button-row"><button class="button primary" type="submit">保存新密码</button><a class="button secondary" href="/profile">取消</a></div></form></section>
{{end}}
