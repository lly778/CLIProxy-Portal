{{define "content"}}
<section class="auth-card">
  <div class="auth-head"><span class="eyebrow">欢迎回来</span><h1>登录账号门户</h1><p>使用手机号和密码登录，管理 API Key 与使用量。</p></div>
  {{if .Error}}<div class="alert danger" role="alert">{{.Error}}</div>{{end}}
  {{if .Flash}}<div class="alert {{.Flash.Kind}}" role="status">{{.Flash.Message}}</div>{{end}}
  <form method="post" action="/login" class="stack-form">
    {{if .CSRFToken}}<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">{{end}}
    {{if .Next}}<input type="hidden" name="next" value="{{.Next}}">{{end}}
    <label>手机号<input type="tel" name="phone" inputmode="numeric" autocomplete="username" value="{{.Phone}}" placeholder="请输入 11 位手机号" maxlength="11" required></label>
    <label>密码<input type="password" name="password" autocomplete="current-password" required></label>
    <label class="check-row"><input type="checkbox" name="remember" value="1"{{if .Remember}} checked{{end}}> 保持登录（最长 30 天）</label>
    <button class="button primary wide" type="submit">登录</button>
  </form>
  <div class="auth-foot"><span>还没有账号？</span><a href="/register">申请注册</a><span class="dot">·</span><a href="/reset">已有重置码？设置新密码</a></div>
</section>
{{end}}
